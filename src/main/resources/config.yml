  prefix: '&8[&bCdrAuth&8] &r'
  register-start: '&7Akun belum terdaftar. Buat PIN &b%length% digit&7.'
  login-start: '&7Masukkan PIN untuk melanjutkan.'
  confirm-pin: '&7Masukkan ulang PIN untuk konfirmasi.'
  registered: '&aRegistrasi berhasil. IP akun sudah dikunci.'
  logged-in: '&aLogin berhasil. Selamat datang!'
  pin-invalid: '&cPIN harus terdiri dari tepat %length% angka.'
  pin-mismatch: '&cPIN konfirmasi tidak sama. Silakan buat PIN lagi.'
  wrong-pin: '&cPIN salah. Sisa percobaan: &f%remaining%'
  too-many-attempts: '&cTerlalu banyak percobaan PIN yang salah.'
  ip-mismatch: '&cAkun ini terikat ke IP lain. Hubungi admin untuk unregister sebelum berpindah IP.'
  no-address: '&cAlamat IP koneksi tidak dapat dibaca. Login ditolak demi keamanan.'
  gui-login-title: '&0CdrAuth • Login'
  gui-register-title: '&0CdrAuth • Register'
  gui-confirm-title: '&0CdrAuth • Confirm PIN'
  gui-pin-display: '&bPIN: &f%pin%'
  gui-backspace: '&e⌫ Hapus'
