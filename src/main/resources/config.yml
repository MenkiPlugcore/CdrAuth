security:
  # Numeric PIN length used by both Java and Bedrock UI.
  pin-length: 6

  # Kick after this many wrong PIN attempts in one login session.
  max-attempts: 5

  # PBKDF2-HMAC-SHA256 work factor for PIN hashing.
  pbkdf2-iterations: 210000

  # Registered/trusted IP skips the PIN screen on future joins.
  trusted-ip-auto-login: true

  # One trusted IP can only belong to one registered account.
  # Disable this if several legitimate players share the same public IP / CGNAT.
  unique-ip-ownership: true

  # Player must finish register/login within this time or they are kicked.
  authentication-timeout-seconds: 60

  # security.log contains security events and short HMAC IP fingerprints, never plaintext IPs.
  audit-log-enabled: true

  cooldown:
    # Wrong PIN attempts receive a progressive delay: base * attempt, capped by max.
    base-seconds: 2
    max-seconds: 15

  bruteforce:
    # Failed PIN attempts survive reconnects in memory for this rolling window.
    window-seconds: 600

    # Lock account+IP after this many wrong PINs inside the window.
    max-failures: 10

    # Temporary lock duration after the brute-force threshold is reached.
    lockout-seconds: 300

  # A different IP may still log in after entering the correct PIN, but it is session-only.
  # The trusted IP is never replaced automatically unless an admin runs /cdrauth resetip.

  # Delay before reopening the Java GUI if the player closes it before authenticating.
  reopen-delay-ticks: 8

