security:
  # Numeric PIN length used by Java private-chat input and Bedrock UI.
  pin-length: 6

  # Kick after this many wrong PIN attempts in one login session.
  max-attempts: 5

  # PBKDF2-HMAC-SHA256 work factor for PIN hashing.
  pbkdf2-iterations: 210000

  # Registered/trusted IP skips the PIN screen on future joins.
  trusted-ip-auto-login: true

  # One trusted IP can only belong to one registered account.
  # Disable this if several legitimate players share the same public IP / CGNAT.
  unique-ip-ownership: true

  # Player must finish register/login/change-PIN within this time or they are kicked.
  authentication-timeout-seconds: 60

  # security.log contains security events and short HMAC IP fingerprints, never plaintext IPs.
  audit-log-enabled: true

  audit:
    max-file-size-kb: 1024
    history-files: 3
    viewer-max-entries: 500
    viewer-scan-lines: 5000

  # Java login/register presentation.
  login-ux:
    # Number of blank lines sent once when authentication begins to clear visible chat history.
    clear-chat-lines: 80

    # Potion amplifier: 0 = Slowness I, 4 = Slowness V.
    slowness-amplifier: 4

    # If true, player can move slowly while login/register is pending.
    # Other interactions, commands, inventories, damage, pickup/drop, etc. stay locked.
    allow-slow-movement: true

  change-pin:
    # Recommended: only allow /pin from the account's trusted IP.
    # The old PIN must still be verified even when this is false.
    require-trusted-ip: true

  cooldown:
    base-seconds: 2
    max-seconds: 15

  bruteforce:
    window-seconds: 600
    max-failures: 10
    lockout-seconds: 300

  # Delay before reopening the Bedrock form after it is closed during authentication.
  reopen-delay-ticks: 8

