name: CdrAuth
version: '${project.version}'
main: id.menkiplugcore.cdrauth.CdrAuthPlugin
api-version: '1.21.11'
author: CADERA
website: https://github.com/MenkiPlugcore/CdrAuth
description: Crossplay GUI PIN authentication with trusted-IP security, account management, player PIN changes, and admin GUI.
softdepend: [floodgate]
commands:
  cdrauth:
    description: CdrAuth administrative command and GUI.
    usage: /cdrauth <admin|status|resetip|resetpin|unreg> [player|uuid]
    permission: cdrauth.admin
  pin:
    description: Change your CdrAuth PIN through the secure GUI.
    usage: /pin
    aliases: [changepin]
    permission: cdrauth.changepin
permissions:
  cdrauth.admin:
    description: Allows CdrAuth administration and admin GUI access.
    default: op
  cdrauth.changepin:
    description: Allows a player to change their own CdrAuth PIN.
    default: true
