name: CdrAuth
version: '${project.version}'
main: id.menkiplugcore.cdrauth.CdrAuthPlugin
api-version: '1.21.11'
author: CADERA
website: https://github.com/MenkiPlugcore/CdrAuth
description: Crossplay PIN authentication with private Java chat input, native Bedrock forms, trusted-IP security, account management, admin GUI, and audit history.
softdepend: [floodgate]
commands:
  cdrauth:
    description: CdrAuth administrative command, GUI, and audit viewer.
    usage: /cdrauth <admin|audit|status|resetip|resetpin|unreg> [player|uuid]
    permission: cdrauth.admin
  pin:
    description: Change your CdrAuth PIN through the secure input flow.
    usage: /pin
    aliases: [changepin]
    permission: cdrauth.changepin
permissions:
  cdrauth.admin:
    description: Allows CdrAuth administration, admin GUI, and audit viewer access.
    default: op
  cdrauth.changepin:
    description: Allows a player to change their own CdrAuth PIN.
    default: true
